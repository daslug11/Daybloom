# Local Supabase for development and end-to-end tests ONLY (not used in production).
# Start with:  npm run supabase:up   (see scripts/local-supabase.mjs)
name: daybloom-supabase
services:
  db:
    image: ghcr.io/supabase/postgres:17.6.1.064
    ports: ["54322:5432"]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    volumes:
      - ./roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 2s
      timeout: 5s
      retries: 30

  auth:
    image: ghcr.io/supabase/gotrue:v2.180.0
    depends_on:
      db: { condition: service_healthy }
    ports: ["54331:9999"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_SMTP_ADMIN_EMAIL: hello@daybloom.online
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_SENDER_NAME: Daybloom
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      # Branded templates from supabase/templates, served by the local gateway.
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://host.docker.internal:54321/templates/confirm-signup.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://host.docker.internal:54321/templates/magic-link.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://host.docker.internal:54321/templates/reset-password.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://host.docker.internal:54321/templates/change-email.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Confirm your Daybloom account
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Your Daybloom sign-in link
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Reset your Daybloom password
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: Confirm your new email for Daybloom

  rest:
    image: ghcr.io/supabase/postgrest:v12.2.12
    depends_on:
      db: { condition: service_healthy }
    ports: ["54332:3000"]
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  mail:
    image: ghcr.io/axllent/mailpit:latest
    ports: ["54324:8025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
